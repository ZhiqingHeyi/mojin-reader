<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸金阅读</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #1B1610;
            overflow: hidden;
        }
        
        #root {
            height: 100vh;
            width: 100vw;
        }
        
        /* 加载动画 */
        .initial-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 40%, #2D251A 0%, #1B1610 55%, #14100B 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-content {
            text-align: center;
            color: #E9CE8C;
        }
        
        .loading-spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(201, 169, 110, 0.2);
            border-top: 4px solid #E9CE8C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 24px rgba(233, 206, 140, 0.15);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }
        
        /* 隐藏加载动画 */
        .initial-loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 初始加载动画 -->
    <div id="initial-loading" class="initial-loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">摸金阅读启动中...</p>
        </div>
    </div>
    
    <!-- React应用根节点 -->
    <div id="root"></div>
    
    <script>
        // 定义global对象以解决ReferenceError: global is not defined错误
        if (typeof global === 'undefined') {
            window.global = window;
        }
        
        // 当React应用加载完成后隐藏初始加载动画
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loadingElement = document.getElementById('initial-loading');
                if (loadingElement) {
                    loadingElement.classList.add('hidden');
                }
            }, 1000);
        });
        
        // 阻止默认的拖拽行为
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        
        document.addEventListener('drop', (e) => {
            e.preventDefault();
        });
        
        // 阻止右键菜单
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // 阻止某些快捷键
        document.addEventListener('keydown', (e) => {
            // 阻止F12开发者工具（生产环境）
            if (e.key === 'F12' && !window.location.href.includes('localhost')) {
                e.preventDefault();
            }
            
            // 阻止Ctrl+Shift+I开发者工具（生产环境）
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I' && !window.location.href.includes('localhost')) {
                e.preventDefault();
            }
            
            // 阻止Ctrl+U查看源码（生产环境）
            if ((e.ctrlKey || e.metaKey) && e.key === 'u' && !window.location.href.includes('localhost')) {
                e.preventDefault();
            }
        });
        
        // 错误处理
        window.addEventListener('error', (e) => {
            console.error('页面错误:', e.error);
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            console.error('未处理的Promise拒绝:', e.reason);
        });
    </script>
</body>
</html>
